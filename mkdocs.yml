# MkDocs configuration for the AgentLab documentation site.
# Build locally:  pip install -r requirements-docs.txt && mkdocs serve
# Production:     GitHub Actions builds with 'mkdocs build --strict' and deploys to Pages.

site_name: AgentLab
site_description: Proxmox VE sandbox and job orchestration for AI coding agents.
site_url: https://nibzard.github.io/agentlab/
repo_url: https://github.com/nibzard/agentlab
repo_name: nibzard/agentlab
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
strict: true
use_directory_urls: true

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - redirects:
      redirect_maps:
        quickstart.md: tutorials/install-agentlab.md
        cli.md: reference/cli.md
        configuration.md: reference/configuration.md
        api.md: reference/http-api.md
        architecture.md: explanation/architecture.md
        state-model.md: reference/state-machine.md
        security.md: reference/security.md
        secrets.md: reference/secrets.md
        runbook.md: how-to/debug-a-stuck-sandbox.md
        troubleshooting.md: how-to/debug-a-stuck-sandbox.md
        upgrading.md: how-to/upgrade-and-migrate.md
        releases.md: reference/releases.md
        offline.md: how-to/run-air-gapped-offline.md
        remote-cli.md: how-to/connect-remote-daemon-over-tailnet.md
        proxmox.md: how-to/configure-proxmox-api-backend.md
        performance.md: explanation/performance-and-tuning.md
        faq.md: explanation/faq.md
        ssh_gateway_spike.md: how-to/build-and-run-ssh-gateway.md
        STYLE.md: meta/style-guide.md
        README.md: index.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true

