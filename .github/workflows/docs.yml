name: docs

# Build the MkDocs site and deploy it to GitHub Pages.
# The CLI reference (docs/reference/cli.md) is generated from the binary, and
# the snippet validator rejects any `agentlab ...` example that is not a real
# command, so the published docs cannot drift from the code.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'scripts/dev/**'
      - 'cmd/agentlab/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'scripts/dev/**'
      - 'cmd/agentlab/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one docs build per ref at a time.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install docs tools
        run: pip install -r requirements-docs.txt

      - name: Regenerate CLI reference
        run: make docs-gen

      - name: Markdown lint
        run: npx --yes markdownlint-cli2

      - name: Validate command snippets
        run: ./scripts/dev/docs_snippets_check.sh

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          fail: false

      - name: Build site (strict)
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
